# native_toolchain_rust (the Flutter build hook, D7) requires an exact
# version and the list of targets. Keep `channel` in sync with the root
# rust-toolchain.toml (D5).
[toolchain]
channel = "1.99.1"
profile = "minimal"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
