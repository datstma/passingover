[package]
name = "passingover_bridge"
description = "Thin flutter_rust_bridge layer between the Passing Over app and passingover-core."
version.workspace = true
# Stays on 2021: it holds code generated by flutter_rust_bridge.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
passingover-core.workspace = true

[dev-dependencies]
flate2.workspace = true

# Not the workspace lints: the generated FFI glue needs `unsafe` (D6).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
