# cargo-deny: licenses, security advisories, banned or duplicate crates, and
# allowed sources. `scripts/ci.sh local` runs `cargo deny --all-features check`.

[graph]
# Check the dependency graph for every platform Passing Over ships on.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[advisories]
# RustSec advisories (vulnerable, unmaintained, yanked) fail the check.
# Add an entry here only with a comment explaining why it is safe.
ignore = []

[licenses]
# Licenses compatible with distributing Passing Over as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Allowances for licenses no current dependency uses are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
