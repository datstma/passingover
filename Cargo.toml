[workspace]
resolver = "3"
members = [
    "crates/passingover-core",
    "crates/passingover-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/datstma/passingover"
homepage = "https://github.com/datstma/passingover"

[workspace.dependencies]
passingover-core = { path = "crates/passingover-core", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
