name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please don't include your
        precise location; a nearby city is enough. Security issues go through
        [private reporting](https://github.com/datstma/passingover/security/advisories/new),
        not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `passingover now --lat 59.65 --lon 17.92`
        2. …
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - CLI
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "`passingover --version`, or a git commit hash"
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
