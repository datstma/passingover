name: Idea or feature request
description: Suggest something that would make Passing Over better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Passing Over is built for daydreaming, not plane-spotting: calm over
        busy, few numbers. Ideas in that spirit are very welcome.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and the moment you'd use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've considered or seen elsewhere?
